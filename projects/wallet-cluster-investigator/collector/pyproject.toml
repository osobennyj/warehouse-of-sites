[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wci"
version = "0.1.0"
description = "Wallet Cluster Investigator — on-chain funding graph expansion and clustering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "networkx>=3",
    "typer>=0.12",
    "structlog>=24",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[project.scripts]
wci = "wci.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/wci/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["wci"]

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true