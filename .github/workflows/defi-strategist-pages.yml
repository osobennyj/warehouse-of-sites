name: DeFi Strategist Playground Pages

on:
  push:
    branches: [master, 'cursor/**']
    paths:
      - 'projects/defi-strategist-mcp/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: defi-strategist-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/defi-strategist-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: projects/defi-strategist-mcp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: node scripts/snapshot.mjs
      - run: pnpm run build
      - run: VITE_BASE=/warehouse-of-sites/defi-strategist/ pnpm --filter @defi-strategist/playground run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/defi-strategist-mcp/apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4