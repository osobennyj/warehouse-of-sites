name: DeFi Strategist MCP CI

on:
  push:
    branches: [master, 'cursor/**']
    paths:
      - 'projects/defi-strategist-mcp/**'
      - '.github/workflows/defi-strategist-*.yml'
  pull_request:
    paths:
      - 'projects/defi-strategist-mcp/**'

defaults:
  run:
    working-directory: projects/defi-strategist-mcp

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: projects/defi-strategist-mcp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm --filter @defi-strategist/playground exec playwright install chromium --with-deps
      - run: pnpm --filter @defi-strategist/playground run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173