name: DeFi Strategist daily snapshot

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/defi-strategist-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/snapshot.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(defi-strategist): refresh public API snapshots'
          file_pattern: projects/defi-strategist-mcp/apps/playground/public/snapshots/*.json